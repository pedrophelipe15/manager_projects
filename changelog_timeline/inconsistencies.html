<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="inconsistencies.css?v=4">
</head>
<body>
    <div class="page-container">
        <!-- Navigation -->
        <nav class="nav-bar">
            <a href="/hierarchy/dashboard-v2.html" class="nav-link">&#x1F4CA; Hierarquia</a>
            <a href="/dashboard.html" class="nav-link">Dashboard</a>
            <a href="/wave1.html" class="nav-link">Gargalo e Fluxo</a>
            <a href="/wave2.html" class="nav-link">Previsibilidade</a>
            <a href="/wave3.html" class="nav-link">Pessoas</a>
            <a href="/wave4.html" class="nav-link">Portfolio</a>
            <a href="/insights.html" class="nav-link">Insights</a>
            <a href="/maturidade.html" class="nav-link">&#x1F331; Maturidade</a>
            <a href="/inconsistencies.html" class="nav-link active">Inconsistencias</a>
            <a href="/settings.html" class="nav-link">Configuracoes</a>
        </nav>

        <header class="page-header">
            <h1>Inconsistências</h1>
            <p class="subtitle">Validações de dados por projeto</p>
        </header>

        <!-- Filtro de Projeto -->
        <section class="filter-section glass">
            <label for="projectFilter">Projeto:</label>
            <select id="projectFilter">
                <option value="">Selecione um projeto...</option>
            </select>
            <span class="total-badge" id="totalBadge" style="display:none;">0 inconsistências</span>
            <button class="btn-settings" onclick="openValidationSettings()">Ajustes de Validações</button>
        </section>

        <!-- Modal de Ajustes -->
        <div class="modal-overlay" id="validationModal" onclick="closeValidationModal(event)">
            <div class="modal-content glass" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <h2>Ajustes de Validações</h2>
                    <button class="close-btn" onclick="closeValidationModal()">&times;</button>
                </div>
                <div class="modal-body" id="validationModalBody">
                    <p>Carregando...</p>
                </div>
                <div class="modal-footer">
                    <span class="save-status" id="saveStatus"></span>
                    <button class="btn-modal-cancel" onclick="closeValidationModal()">Cancelar</button>
                    <button class="btn-modal-save" onclick="saveAllValidations()">Salvar</button>
                </div>
            </div>
        </div>

        <!-- Resultados -->
        <div id="results-container">
            <p class="empty-state">Selecione um projeto para verificar inconsistências.</p>
        </div>
    </div>

    <script src="inconsistencies.js?v=6"></script>
    <script src="nav-alerts.js?v=1"></script>
    <style>.nav-alert-badge{position:absolute;top:-4px;right:-6px;min-width:16px;height:16px;padding:0 4px;background:#f59e0b;color:#0f172a;border-radius:10px;font-size:0.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}.nav-alert-badge.critical{background:#ef4444;color:#fff}</style>
</body>
</html>
