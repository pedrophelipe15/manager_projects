<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Initiative Health - Hierarchy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <link rel="stylesheet" href="../tokens.css?v=2">
    <link rel="stylesheet" href="hierarchy.css?v=1">
    <style>
        .row-done { background: rgba(16, 185, 129, 0.08) !important; }
        .row-in-progress { background: rgba(59, 130, 246, 0.08) !important; }
        .row-blocked { background: rgba(245, 158, 11, 0.1) !important; }
        .row-test { background: rgba(168, 85, 247, 0.08) !important; }
        .row-waiting { background: rgba(245, 158, 11, 0.08) !important; }
        .row-canceled { background: rgba(239, 68, 68, 0.1) !important; }

        /* Filtros dropdown com checkbox */
        .filters-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
        .dd-wrapper { position: relative; }
        .dd-toggle {
            display: flex; align-items: center; gap: 0.4rem;
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1);
            color: #f8fafc; padding: 0.4rem 0.75rem; border-radius: 6px;
            font-size: 0.8rem; font-family: inherit; cursor: pointer; transition: border-color 0.2s;
        }
        .dd-toggle:hover { border-color: var(--accent, #3b82f6); }
        .dd-label { color: #94a3b8; }
        .dd-count { color: var(--accent, #3b82f6); font-weight: 600; font-size: 0.75rem; }
        .dd-arrow { color: #64748b; font-size: 0.65rem; }
        .dd-menu {
            display: none; position: absolute; top: calc(100% + 4px); left: 0;
            background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            min-width: 180px; max-height: 220px; overflow-y: auto; z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); padding: 0.4rem 0;
        }
        .dd-menu.open { display: block; }
        .dd-option {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.4rem 0.75rem; font-size: 0.78rem; color: #f8fafc;
            cursor: pointer; transition: background 0.15s;
        }
        .dd-option:hover { background: rgba(255,255,255,0.05); }
        .dd-option input[type=checkbox] { accent-color: var(--accent, #3b82f6); width: 14px; height: 14px; cursor: pointer; }
        .btn-clear-filters {
            background: none; border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8; padding: 0.4rem 0.75rem; border-radius: 6px;
            font-size: 0.78rem; cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .btn-clear-filters:hover { color: #f8fafc; border-color: var(--accent, #3b82f6); }

        /* Sortable headers */
        .sortable { cursor: pointer; user-select: none; white-space: nowrap; }
        .sortable:hover { color: #f8fafc; }

        /* KPI cards clicaveis (abrem o painel de detalhe abaixo) */
        .kpi-card.kpi-clickable { cursor: pointer; transition: border-color 0.2s, background 0.2s; }
        .kpi-card.kpi-clickable:hover { border-color: var(--accent, #3b82f6); background: rgba(59, 130, 246, 0.06); }
        .kpi-card.kpi-clickable.active { border-color: var(--accent, #3b82f6); background: rgba(59, 130, 246, 0.1); }
        .kpi-card.kpi-clickable .kpi-label::after { content: " ›"; color: var(--accent, #3b82f6); font-weight: 700; }

        /* Painel de detalhe inline (mesmo padrao de epic-health) */
        #kpi-detail-panel { scroll-margin-top: 1rem; margin-bottom: 1rem; }
        #kpi-detail-panel .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
        #kpi-detail-panel .detail-head h2 { font-size: 1.1rem; font-weight: 700; margin: 0; }
        #kpi-detail-panel .detail-count {
            display: inline-block; margin-left: 0.4rem; font-size: 0.78rem; font-weight: 700;
            color: var(--accent, #3b82f6); background: rgba(59, 130, 246, 0.12); padding: 0.05rem 0.5rem; border-radius: 10px;
        }
        #kpi-detail-panel .detail-table-wrap { overflow-x: auto; max-height: 60vh; overflow-y: auto; }
        #kpi-detail-panel .data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        #kpi-detail-panel .data-table th {
            text-align: left; padding: 0.5rem 0.6rem; color: #94a3b8;
            border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em;
            position: sticky; top: 0; background: #1e293b; z-index: 1;
        }
        #kpi-detail-panel .data-table th.sortable { cursor: pointer; user-select: none; }
        #kpi-detail-panel .data-table th.sortable:hover { color: #f8fafc; }
        #kpi-detail-panel .data-table th .sort-ind { color: #64748b; font-size: 0.72rem; margin-left: 0.15rem; }
        #kpi-detail-panel .data-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
        #kpi-detail-panel .data-table tr:hover { background: rgba(255,255,255,0.02); }
        #kpi-detail-panel .mm-summary { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #kpi-detail-panel .mm-date { white-space: nowrap; font-variant-numeric: tabular-nums; }
        #kpi-detail-panel .jira-link { color: var(--accent, #3b82f6); text-decoration: none; font-weight: 600; }
        #kpi-detail-panel .jira-link:hover { text-decoration: underline; }
        #kpi-detail-panel .detail-pager { margin-left: auto; display: flex; align-items: center; gap: 0.4rem; color: #94a3b8; font-size: 0.78rem; }
        #kpi-detail-panel .detail-pager-info { color: #64748b; }
        #kpi-detail-panel .detail-pager-page { min-width: 62px; text-align: center; font-variant-numeric: tabular-nums; }
        #kpi-detail-panel .detail-pager-btn {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1);
            color: #f8fafc; width: 28px; height: 28px; border-radius: 6px;
            cursor: pointer; font-size: 1rem; line-height: 1; font-family: inherit; transition: all 0.2s;
        }
        #kpi-detail-panel .detail-pager-btn:hover:not(:disabled) { border-color: var(--accent, #3b82f6); color: var(--accent, #3b82f6); }
        #kpi-detail-panel .detail-pager-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        #kpi-detail-panel .btn-clear-filters:disabled { opacity: 0.4; cursor: not-allowed; }
        @media (max-width: 768px) { #kpi-detail-panel .detail-pager { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Navigation -->
        <nav id="hierarchy-nav" class="nav-bar"></nav>

        <header class="page-header">
            <h1 id="page-title">Initiative Health</h1>
            <p class="subtitle" id="page-subtitle">Visao corporativa: progresso ponderado, risco e times envolvidos por iniciativa</p>
        </header>

        <!-- KPIs -->
        <div id="kpi-container" class="kpi-grid" style="display:none;"></div>

        <!-- Painel de detalhe (issues do KPI clicado) -->
        <section id="kpi-detail-panel" class="metric-section glass" style="display:none;"></section>

        <!-- Content -->
        <div id="content-container" class="metrics-grid">
            <p class="empty-state">Carregando...</p>
        </div>
    </div>

    <script src="nav.js?v=3"></script>
    <script src="initiative-health.js?v=4"></script>
</body>
</html>
